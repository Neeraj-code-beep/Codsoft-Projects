<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#dde1e7" />
    <link rel="stylesheet" href="style.css" />
    <title>Calculator</title>
  </head>
  <body>
    <main class="container" aria-label="Calculator">
      <h1 class="visually-hidden">Calculator</h1>
      <div class="result" aria-live="polite" aria-atomic="true">
        <p id="result-box">0</p>
      </div>

      <div class="buttons" aria-label="Calculator keys">
        <button class="button action-btn" id="clear" type="button" aria-label="Clear all">AC</button>
        <button class="button action-btn" id="backspace" type="button" aria-label="Delete last character">⌫</button>
        <button class="button num-button action-btn" type="button" aria-label="Remainder">%</button>
        <button class="button num-button calc-action-btn" type="button" aria-label="Divide">/</button>
        <button class="button num-button" type="button">7</button>
        <button class="button num-button" type="button">8</button>
        <button class="button num-button" type="button">9</button>
        <button class="button num-button calc-action-btn" type="button" aria-label="Multiply">*</button>
        <button class="button num-button" type="button">4</button>
        <button class="button num-button" type="button">5</button>
        <button class="button num-button" type="button">6</button>
        <button class="button num-button calc-action-btn" type="button" aria-label="Subtract">-</button>
        <button class="button num-button" type="button">1</button>
        <button class="button num-button" type="button">2</button>
        <button class="button num-button" type="button">3</button>
        <button class="button num-button calc-action-btn" type="button" aria-label="Add">+</button>
        <button class="button num-button zero" type="button">0</button>
        <button class="button num-button" type="button" aria-label="Decimal point">.</button>
        <button class="button calc-action-btn" id="total" type="button" aria-label="Calculate">=</button>
      </div>
    </main>
    <script src="script.js"></script>
  </body>
</html>
