<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#753682" />
    <meta name="description" content="A two-player Pig dice game. Roll to build your turn score, or hold to bank it before you roll a one." />
    <title>Pig Game — Roll or Hold</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="game" aria-label="Pig dice game">
      <section class="player player--0 player--active" aria-labelledby="name--0">
        <h2 class="name" id="name--0">Player 1</h2>
        <p class="score" id="score--0">0</p>
        <div class="current" aria-label="Player 1 turn score">
          <p class="current-label">Current</p>
          <p class="current-score" id="current--0">0</p>
        </div>
      </section>
      <section class="player player--1" aria-labelledby="name--1">
        <h2 class="name" id="name--1">Player 2</h2>
        <p class="score" id="score--1">0</p>
        <div class="current" aria-label="Player 2 turn score">
          <p class="current-label">Current</p>
          <p class="current-score" id="current--1">0</p>
        </div>
      </section>

      <img src="assets/dice-5.png" alt="Die not rolled yet" class="dice hidden" />
      <button class="btn btn--new" type="button" aria-label="Start a new game"><span aria-hidden="true">🔄</span> New game</button>
      <button class="btn btn--roll" type="button" aria-label="Roll the die"><span aria-hidden="true">🎲</span> Roll dice</button>
      <button class="btn btn--hold" type="button" aria-label="Hold and bank turn score"><span aria-hidden="true">📥</span> Hold</button>
      <p class="sr-only" id="game-status" role="status" aria-live="polite" aria-atomic="true">New game. Player 1's turn.</p>
    </main>
  </body>
</html>
