<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#6a4081" />
    <meta name="description" content="A simple task list that saves your tasks in this browser." />
    <title>To-Do Manager</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="todo-app">
      <header class="page-heading">
        <p class="thought">A little progress adds up</p>
        <h1>To Do</h1>
      </header>

      <form class="task-form" id="form">
        <label class="sr-only" for="input">New task</label>
        <input
          type="text"
          class="input"
          id="input"
          name="task"
          placeholder="What needs doing?"
          autocomplete="off"
          maxlength="160"
          aria-describedby="input-help"
        />
        <button class="add-button" type="submit">Add task</button>
      </form>
      <p class="input-help" id="input-help">Press Enter or select Add task. Tasks stay in this browser.</p>

      <section class="task-panel" aria-label="Your task list">
        <div class="list-heading">
          <h2>My tasks</h2>
          <p class="todo-count" id="todo-count">0 tasks · 0 left</p>
        </div>
        <ul class="todos" id="todos" aria-label="Tasks"></ul>
      </section>

      <p class="status" id="status" role="status" aria-live="polite" aria-atomic="true"></p>
    </main>
  </body>
</html>
